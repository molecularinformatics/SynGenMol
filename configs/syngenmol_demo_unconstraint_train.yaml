# Run from the repository root after exporting SYNGENMOL_GEODIFF_CHECKPOINT.
# The fixed, scored warm-up table is included under data/example/.
search_space: outputs/syngenmol_demo_unconstraint/search_space
output_dir: outputs/syngenmol_demo_unconstraint/training
device: cuda
seed: 20260904

model:
  n_embd: 64
  n_layer: 2
  n_head: 2

# This is task-specific terminal-value warm-up. It jointly updates the shared
# Transformer trunk and the value head before PPO; it is not route pretraining.
warmup:
  trajectories_csv: data/example/syngenmol_demo_unconstraint_warmup_trajectories.csv
  score_column: score
  sequence_column: name
  epochs: 10
  batch_size: 64
  learning_rate: 1.0e-4
  validation_fraction: 0.2
  split_seed: 20260904
  device: cuda

# PED/GeoDiff code and the checkpoint are installed and managed by the user.
oracle:
  name: ped_geodiff
  reference_smiles: "C/C=C/C(=O)N[C@H]1CCCN(c2c(F)cc(C(N)=O)c3[nH]c(C)c(C)c23)C1"
  checkpoint_path: "${SYNGENMOL_GEODIFF_CHECKPOINT}"
  embedding_mode: "3D"
  distance_metric: euclidean
  batch_size: 64
  num_workers: 16
  device: cuda
  seed: 42
  invalid_score: 0.0
  transformation:
    high: 10.0
    low: 1.0
    k: -0.25

ppo:
  # One step generates, scores, and updates on 64 fresh trajectories.
  steps: 500
  max_reactions: 1
  batch_size: 64
  mini_batch_size: 64
  learning_rate: 1.0e-4
  initial_kl_coefficient: 0.05
  clip_range: 0.2
  value_clip_range: 0.2
  value_loss_coefficient: 0.5
  gamma: 1.0
  lam: 0.95
  entropy_coefficient: 0.1
  ppo_epochs: 4
  # The KL reference policy is an exponential moving average of the policy,
  # refreshed every `reference_update_interval` PPO updates.
  reference_ema_decay: 0.99
  reference_update_interval: 3
  # Products at or above this molecular weight keep a score of 0.0 and are
  # never sent to the oracle.
  maximum_molecular_weight: 800.0
  temperature: 1.0
  top_p: 1.0
  epsilon: 0.0
